name: Update profile README

on:
  workflow_dispatch:
  schedule:
    # Twice a week: keep the command center fresh without noisy daily commits.
    - cron: "17 11 * * 1,4"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Generate dynamic README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit changes if profile telemetry moved
        run: |
          if git diff --quiet README.md; then
            echo "No README telemetry changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile telemetry"
          git push
