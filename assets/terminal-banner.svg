<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hellasleeper terminal banner</title>
  <desc id="desc">A dark CRT terminal style banner for Jaramie Morris, AI software engineering student and security tooling builder.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#073642"/>
      <stop offset="45%" stop-color="#041116"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#b967ff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="transparent"/>
      <rect y="0" width="6" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <rect x="18" y="18" width="1164" height="324" rx="18" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="18" y="18" width="1164" height="324" rx="18" fill="url(#scanlines)" opacity="0.7"/>

  <g opacity="0.32" stroke="#00e5ff" stroke-width="1">
    <path d="M60 275 C210 205 286 302 420 235 S700 156 840 221 1050 292 1140 210"/>
    <path d="M52 294 C211 240 294 324 433 268 S698 199 835 254 1050 324 1148 246" stroke="#39ff14"/>
    <path d="M60 310 H1140" opacity="0.25"/>
    <path d="M92 64 H1110" opacity="0.25"/>
  </g>

  <g font-family="Consolas, 'Cascadia Mono', 'Fira Code', monospace">
    <text x="72" y="78" fill="#39ff14" font-size="22" letter-spacing="2">$ boot --profile hellasleeper108 --mode build-in-public</text>
    <text x="72" y="154" fill="url(#cyan)" font-size="74" font-weight="800" letter-spacing="4" filter="url(#softGlow)">HELLASLEEPER</text>
    <text x="76" y="206" fill="#c9f7ff" font-size="29" letter-spacing="1.8">AI SOFTWARE ENGINEERING · BLUE TEAM LABS · OSINT TOOLS</text>
    <text x="78" y="252" fill="#8b949e" font-size="23">local-first systems / terminal interfaces / practical cyber-defense</text>
    <text x="78" y="305" fill="#39ff14" font-size="23">status: shipping weird useful things</text>
    <rect x="500" y="286" width="14" height="27" fill="#39ff14" opacity="0.9">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(930 76)" opacity="0.85">
    <circle cx="82" cy="82" r="70" stroke="#39ff14" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="82" cy="82" r="47" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M82 13 V151 M13 82 H151 M32 32 L132 132 M132 32 L32 132" stroke="#00e5ff" stroke-opacity="0.22"/>
    <circle cx="119" cy="54" r="5" fill="#39ff14" filter="url(#softGlow)"/>
    <circle cx="55" cy="112" r="4" fill="#00e5ff" filter="url(#softGlow)"/>
    <circle cx="100" cy="121" r="3" fill="#b967ff" filter="url(#softGlow)"/>
  </g>
</svg>
